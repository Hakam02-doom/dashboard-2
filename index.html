<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf0f8" />
    <script>
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("uplift-dashboard-2-appearance") || "system"; } catch {}
        const dark = preference === "dark" ||
          (preference !== "light" && preference !== "dark" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#191c27" : "#edf0f8";
      })();
    </script>
    <meta
      name="description"
      content="Uplift AI — your content, search visibility, and publishing in one workspace."
    />
    <title>Dashboard 2 · Uplift AI</title>
  </head>
  <body>
    <!-- THESIS: Uplift's daily operating view faithfully follows the user-selected Clinexa dashboard.
OWN-WORLD: Cool pale lavender-to-mint canvas, soft white panels, compact Inter typography, purple icon rail, pastel green charts.
STORY: Scan content production, review the publishing mix, then open the next scheduled article.
FIRST VIEWPORT: Slim icon rail; heading and workspace selector; four equal metrics; two-thirds-width bar chart and upcoming content; one-third-width distribution panel.
FORM: User-pinned Clinexa laptop-screen reference; no concept roll or alternate visual world overrides the explicit reproduction request.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
