<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff1f6" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("dashboard-2-theme"); } catch {}
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#151820" : "#eff1f6";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Uplift AI — your content, search visibility, and publishing in one workspace."
    />
    <title>Uplift AI · Content Workspace</title>
  </head>
